[project]
name = "decision-intelligence-governance-engine"
version = "0.3.0"
description = "Evidence-backed, human-in-the-loop decision intelligence and AI governance engine"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "opentelemetry-api>=1.29,<2",
  "opentelemetry-sdk>=1.29,<2",
  "prometheus-client>=0.21,<1",
  "pydantic>=2.8,<3",
  "PyJWT>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8.2,<9", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
