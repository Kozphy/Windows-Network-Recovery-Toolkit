name: Security

on:
  push:
    branches:
      - Multi_Domain_Decision_Platform
      - main
      - master
      - amd_version
      - "feature/**"
      - "feat/**"
      - "fix/**"
      - "ci/**"
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-security:
    name: Python security and safety contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and scanners
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m pip install bandit pip-audit

      - name: Static security analysis (report legacy baseline)
        continue-on-error: true
        run: |
          mkdir -p reports
          bandit -r windows_network_toolkit src platform_core backend \
            --severity-level medium \
            --confidence-level medium \
            --exclude tests \
            -f json -o reports/bandit.json
          bandit -r windows_network_toolkit src platform_core backend \
            --severity-level medium \
            --confidence-level medium \
            --exclude tests \
            -f txt

      - name: Audit Python dependencies
        continue-on-error: true
        run: |
          mkdir -p reports
          pip-audit --format json -o reports/pip-audit.json || true
          pip-audit

      - name: Run safety-contract tests
        run: |
          python -m pytest -q \
            tests/test_proxy_classifier_safety_contract.py \
            tests/test_policy_safety_contract.py

      - name: Public-release hygiene scan
        run: python tools/public_release_audit.py --tracked-only

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-security-${{ github.sha }}
          path: |
            reports/bandit.json
            reports/pip-audit.json
          if-no-files-found: ignore
          retention-days: 30

  dependency-review:
    name: Dependency review
    # Requires the GitHub Dependency graph, which is off for this repository, so the
    # action always errors. Enable it under Settings → Code security, then set the
    # repository variable ENABLE_DEPENDENCY_REVIEW=true to turn this job back on.
    if: github.event_name == 'pull_request' && vars.ENABLE_DEPENDENCY_REVIEW == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@v3

  trivy-fs:
    name: Trivy filesystem
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Scan repository
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-fs.sarif
          exit-code: "0"

      - name: Upload Trivy artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-sarif-${{ github.sha }}
          path: trivy-fs.sarif
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy-fs.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-filesystem

  trivy-image:
    name: Trivy container image
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t er-platform-api:scan-${{ github.sha }} .

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: er-platform-api:scan-${{ github.sha }}
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-image.sarif
          exit-code: "0"

      - name: Upload image scan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-sarif-${{ github.sha }}
          path: trivy-image.sarif
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload image SARIF
        if: always() && hashFiles('trivy-image.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-container
