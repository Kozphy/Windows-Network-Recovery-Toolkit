name: Security

on:
  push:
    branches:
      - Multi_Domain_Decision_Platform
      - main
      - master
      - "fix/**"
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-security:
    name: Python security and safety contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and scanners
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m pip install bandit pip-audit
      - name: Bandit report
        continue-on-error: true
        run: bandit -r windows_network_toolkit src/platform_core -q
      - name: Dependency audit
        continue-on-error: true
        run: pip-audit
      - name: Safety contracts
        run: |
          pytest -q tests/test_proxy_classifier_safety_contract.py
          pytest -q tests/test_policy_safety_contract.py
      - name: Public-release hygiene
        run: python tools/public_release_audit.py --tracked-only

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@v3

  trivy-filesystem:
    name: Trivy filesystem
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Scan repository
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-fs.sarif
          exit-code: "0"
      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-${{ github.sha }}
          path: trivy-fs.sarif
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload SARIF
        if: always() && hashFiles('trivy-fs.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-filesystem

  trivy-image:
    name: Trivy container image
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t er-platform-api:scan-${{ github.sha }} .
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: er-platform-api:scan-${{ github.sha }}
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-image.sarif
          exit-code: "0"
      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-${{ github.sha }}
          path: trivy-image.sarif
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload SARIF
        if: always() && hashFiles('trivy-image.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-container
