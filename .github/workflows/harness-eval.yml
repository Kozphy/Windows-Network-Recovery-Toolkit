name: Harness Evaluation

on:
  pull_request:
    paths:
      - "harness/**"
      - "docs/**"
      - "ai_governance/**"
      - "observability/**"
      - "deploy/**"
      - ".github/workflows/harness-eval.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-harness-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile harness runner
        run: python -m py_compile harness/run_loop.py

      - name: Run bounded verification loop
        run: |
          python harness/run_loop.py \
            --tasks harness/tasks/sample_tasks.jsonl \
            --policy harness/policy.json \
            --out artifacts/harness-results.jsonl

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-results
          path: artifacts/harness-results.jsonl
          if-no-files-found: error
          retention-days: 14
