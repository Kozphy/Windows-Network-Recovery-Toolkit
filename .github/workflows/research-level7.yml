name: Research Level 7

on:
  pull_request:
    paths:
      - 'research/**'
      - 'tests/test_research_benchmark.py'
      - '.github/workflows/research-level7.yml'
  workflow_dispatch:

jobs:
  research-reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install --upgrade pip numpy pandas scikit-learn pytest
      - name: Run research unit tests
        run: pytest -q tests/test_research_benchmark.py
      - name: Generate deterministic controlled telemetry
        run: python research/generate_controlled_telemetry.py --rows 600 --out research/data/controlled_telemetry.csv
      - name: Run calibrated temporal benchmark
        run: >-
          python research/run_benchmark.py
          --data research/data/controlled_telemetry.csv
          --timestamp-column observed_at
          --calibrate
          --bootstrap-iterations 200
          --calibration-bins 10
          --out research/results/ci
      - name: Assert reproducibility artifacts
        run: |
          test -s research/results/ci/benchmark.json
          test -s research/results/ci/benchmark.csv
      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: level7-controlled-benchmark
          path: research/results/ci/
