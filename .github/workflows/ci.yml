# Primary pull-request and main-branch gate.
# CD (image push + VM deploy) lives in build.yml and deploy.yml.
# Scheduled security scans live in security.yml.

name: CI

on:
  pull_request:
    branches:
      - Multi_Domain_Decision_Platform
      - main
      - master
  push:
    branches:
      - Multi_Domain_Decision_Platform
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Security and quality gates must pass for PR/merge protection.
      - name: Ruff lint
        run: ruff check . --output-format=github

      - name: Ruff format check (changed Python files)
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
          fi

          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            echo "No previous revision is available; skipping the diff-scoped format check."
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "$base_sha"
          mapfile -d '' changed_python < <(
            git diff --name-only --diff-filter=ACMR -z "$base_sha" HEAD -- '*.py'
          )
          if (( ${#changed_python[@]} == 0 )); then
            echo "No changed Python files to format-check."
            exit 0
          fi
          ruff format --check "${changed_python[@]}"

      - name: Bandit (focused first-party packages)
        run: bandit -r windows_network_toolkit src/platform_core -q

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Mypy (portfolio modules — matches Makefile typecheck)
        run: >-
          mypy
          src/platform_core/ai_risk_analyst
          src/platform_core/risk
          src/platform_core/governance
          src/platform_core/analytics
          --ignore-missing-imports

  test:
    name: test
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Safety contract tests (ordered)
        run: |
          pytest -q tests/test_policy_safety_contract.py
          pytest -q tests/test_api_dry_run_default.py
          pytest -q tests/test_replay_determinism.py
          pytest -q tests/test_audit_contract.py
          pytest -q tests/test_evidence_level_contract.py
          pytest -q tests/test_safety_contract_extensions.py
          pytest -q tests/test_api_hardening_contract.py
          pytest -q tests/test_policy_model_unit.py
          pytest -q tests/test_fixture_regression_demo.py

      - name: Pytest (full suite)
        run: |
          mkdir -p reports
          pytest -q --junitxml=reports/junit.xml

      - name: Pytest (Linux integration)
        run: pytest -q tests/integration_linux

      - name: Principle contract tests
        run: |
          pytest -q tests/test_observation_not_proof.py tests/test_correlation_not_causation.py
          pytest -q tests/test_confidence_not_certainty.py tests/test_policy_not_safety.py
          pytest -q tests/test_cs1_principle_compliance.py

      - name: Fixture demo smoke (read-only CLI)
        run: |
          python -m src diagnose --fixture tests/fixtures/features_healthy_signals.json
          python -m src proxy-timeline --fixture tests/fixtures/proxy_incidents/unknown_node_powershell_proxy.json --format markdown
          python -m src demo-scenario healthy --format json
          python -m windows_network_toolkit proxy-status --fixture examples/evidence/DEAD_PROXY_CONFIG.json
          python tools/public_release_audit.py --tracked-only

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ github.sha }}
          path: reports/junit.xml
          retention-days: 14

  eval-benchmarks:
    name: eval-benchmarks
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Replay benchmark (CI gate)
        run: |
          mkdir -p reports
          python -m windows_network_toolkit replay-benchmark \
            --cases tests/fixtures/evaluation/replay_cases.jsonl \
            --min-deterministic-rate 1.0 \
            --output reports/replay_benchmark.json \
            --format json

      - name: Classifier benchmark (CI gate)
        run: |
          python -m windows_network_toolkit classifier-benchmark \
            --cases examples/evaluation/classifier_benchmark_sample.json \
            --min-primary-match-rate 0.85 \
            --max-unsafe-rate 0.0 \
            --output reports/classifier_benchmark.json \
            --format json

      - name: Purple Team fixture benchmark (CI smoke)
        run: |
          pytest -q tests/purple_team
          python -m src.purple_team benchmark --no-evidence --json --output reports/purple_benchmark.json
          python -m src.purple_team baselines --output reports/purple_baselines.json

      - name: Research benchmark smoke (schema + determinism)
        run: |
          pytest -q tests/experiments --basetemp=.pytest_tmp
          python -m experiments.run_benchmark --smoke --seed 42 --manifest experiments/configs/v1.json --output experiments/results/ci_smoke
          test -f benchmarks/bootstrap_ci.csv
          test -f benchmarks/results.csv

      - name: Interaction effects smoke (Phase 1)
        run: |
          pytest -q tests/research/interactions
          python -m research.interactions

      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-benchmarks-${{ github.sha }}
          path: |
            reports/replay_benchmark.json
            reports/classifier_benchmark.json
            reports/purple_benchmark.json
            reports/purple_baselines.json
          retention-days: 14

  test-windows:
    name: test-windows
    runs-on: windows-latest
    needs: lint
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Pytest (no platform-gated skips on Windows)
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          $output = python -m pytest -q -rs 2>&1 | Out-String
          $pytestExit = $LASTEXITCODE
          Write-Output $output
          # Deterministic fixture/replay skips are intentional. A skip caused by the
          # runner not looking like Windows means Windows coverage silently vanished.
          $platformSkips = [regex]::Matches($output, '(?im)^SKIPPED \[\d+\].*$') |
            Where-Object { $_.Value -imatch 'windows|win32|platform' }
          if ($platformSkips.Count -gt 0) {
            $platformSkips | ForEach-Object { Write-Output $_.Value }
            throw "Windows CI policy: platform-gated skips are not allowed (found $($platformSkips.Count))."
          }
          if ($pytestExit -ne 0) { exit $pytestExit }

  build-smoke:
    name: build-smoke
    runs-on: ubuntu-latest
    needs: [test, typecheck]
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate docker-compose config
        run: docker compose config --quiet

      - name: Build API image
        run: docker build -t er-platform-api:ci-${{ github.sha }} .

      - name: Compose + health contract tests
        run: pytest -q tests/test_compose_platform_contract.py tests/test_platform_health_routes.py

  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_PLATFORM_API: http://127.0.0.1:8000
          # Public, non-secret CI placeholders so Supabase client construction
          # succeeds during static prerendering. Runtime deployments override them.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-anon-placeholder
