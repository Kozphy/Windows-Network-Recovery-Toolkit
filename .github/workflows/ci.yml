# Validation workflow for the historical audit-custody snapshot.
name: CI

on:
  push:
    branches:
      - Multi_Domain_Decision_Platform
      - main
      - master
      - "fix/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  python:
    name: Python validation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff diagnostics
        continue-on-error: true
        run: |
          ruff check . --output-format=github
          ruff format --check .
      - name: Type check portfolio modules
        run: >-
          mypy
          src/platform_core/ai_risk_analyst
          src/platform_core/risk
          src/platform_core/governance
          src/platform_core/analytics
          --ignore-missing-imports
      - name: Safety contracts
        run: |
          pytest -q tests/test_policy_safety_contract.py
          pytest -q tests/test_proxy_classifier_safety_contract.py
      - name: Audit-custody tests
        run: pytest -q tests/platform_core/audit/test_custody_tip_anchor.py
      - name: Full test suite
        run: |
          mkdir -p reports
          pytest -q --junitxml=reports/junit.xml
      - name: Public-release hygiene
        run: python tools/public_release_audit.py --tracked-only
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ github.sha }}
          path: reports/junit.xml
          if-no-files-found: ignore
          retention-days: 14

  windows:
    name: Windows validation
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run audit and proxy tests
        shell: pwsh
        run: |
          python -m pytest -q tests/platform_core/audit/test_custody_tip_anchor.py tests/test_proxy_drift_toolkit.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_PLATFORM_API: http://127.0.0.1:8000
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: historical-ci-placeholder
