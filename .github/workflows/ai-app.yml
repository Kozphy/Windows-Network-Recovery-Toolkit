name: AI Application

on:
  push:
    branches:
      - upgrade/ai-application-platform
  pull_request:
    paths:
      - 'ai_app/**'
      - 'web/**'
      - '.github/workflows/ai-app.yml'

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: AI application tests
        run: pytest -q tests
      - name: Agent regression eval
        run: python evals/run_eval.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
