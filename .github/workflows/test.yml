# Deprecated: use .github/workflows/ci.yml (test job).
# Kept for manual coverage runs — does not run on push or pull_request.

name: Test (legacy manual)

on:
  workflow_dispatch:

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  pytest-coverage:
    name: pytest (coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          mkdir -p reports
          pytest \
            --junitxml=reports/junit-full.xml \
            --cov=platform_core \
            --cov=backend \
            --cov=evidence \
            --cov=failure_system \
            --cov=telemetry \
            --cov-report=xml:reports/coverage-full.xml \
            --cov-report=html:reports/coverage-html \
            --cov-report=term-missing
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-manual-${{ github.sha }}
          path: |
            reports/junit-full.xml
            reports/coverage-full.xml
            reports/coverage-html
          retention-days: 14
