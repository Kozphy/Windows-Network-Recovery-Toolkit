name: Security and Supply Chain

on:
  pull_request:
  push:
    branches: [Multi_Domain_Decision_Platform]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  python-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Install security tools
        run: python -m pip install --disable-pip-version-check pip-audit cyclonedx-bom

      - name: Audit Python dependencies when present
        shell: bash
        run: |
          if [[ -f requirements.txt ]]; then
            pip-audit -r requirements.txt
            cyclonedx-py requirements requirements.txt -o sbom-python.json
          else
            echo '{"note":"requirements.txt not present"}' > sbom-python.json
          fi

      - name: Upload SBOM evidence
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-evidence
          path: sbom-python.json

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3
